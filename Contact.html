<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Page</title>
    <link rel="stylesheet" href="styles.css">
 </head>
<body>

  <main class="Backdrop">
    <h1 class="about_main_header">Contact Page</h1>
    <h2>Contact the Creator</h2>
      <p>Include name and UNCW email, picture</p>
      

    <h1>Contact and Feedback Form</h1>

    <form method="post" action="https://miswebapps.uncw.edu/mis310/form-submit.aspx">
      <p>
        <label for= "name">Name:</label>
        <input type="text" id = "name" name ="name" required>
      </p>

      <p>
        <label for="email">Email:</label>
        <input type ="email" id ="email" name = "email" required/>
      </p>

        <fieldset>
          <legend>How did you find this website?</legend>
          
          <label for="peer-referral">Peer Referral</label>
          <input type="radio" id="peer-referral" name="How-fieldset" value="Peer Referral">

          <label for="social">Social Media</label>
          <input type="radio" id="social" name="How-fieldset" value="Social Media">

          <label for="search-engine">Search Engine</label>
          <input type="radio" id="search-engine" name="How-fieldset" value="Search Engine">

          <label for="other">Other</label>
          <input type="radio" id="other" name="How-fieldset" value="Other">

        </fieldset>

      <p>
        <label>Feedback and Comments</label>
        <textarea id="comments" name= "comments" rows="10" cols="60"></textarea> 
      </p>

      <p>
        <button>Submit Contact Form</button>
      </p>

    </form>

      <img src="images/ballcap-phone.png" alt= "Image of a person in a jacket and ballcap holding a phone with social media icons emerging from the phone. Indigo, white, yellow, and red color scheme."height="350" width="350">
  </main>
